<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>弥赛鲸福音剧场 · 第一期：以爱意与温暖让鲸鱼更有人情味</title>
<style>
  :root {
    --bg-deep: #060d1c;
    --bg-mid:  #0c1832;
    --bg-glow: #162a54;
    --gold:    #f0cf88;
    --gold-dim:#a38446;
    --cyan:    #7cc9ff;
    --pink:    #f6a8c6;
    --rose:    #e87a96;
    --ivory:   #f5efe2;
    --ink-dim: #a8b7d4;
    --glass:   rgba(11, 22, 46, 0.78);
    --glass-hi:rgba(16, 30, 62, 0.88);
    --border:  rgba(240, 207, 136, 0.34);
    --scene-accent: #f0cf88;
    --scene-tint: rgba(240, 207, 136, 0.14);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: var(--bg-deep);
    color: var(--ivory);
    font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", "Microsoft YaHei", serif;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }

  /* ================== 舞台容器与五大场景转换 ================== */
  #stage {
    position: relative;
    width: 100vw; height: 100vh;
    overflow: hidden;
    background:
      radial-gradient(ellipse 90% 65% at 50% 12%, rgba(240, 207, 136, 0.16), transparent 65%),
      radial-gradient(ellipse 75% 60% at 75% 75%, rgba(124, 201, 255, 0.12), transparent 65%),
      linear-gradient(180deg, #060c1a 0%, #0b1731 55%, #071022 100%);
    transition: background 1.2s cubic-bezier(.22,.8,.28,1);
  }

  /* 场景1：烛光晚祷堂 (Sanctuary) */
  #stage[data-scene="sanctuary"] {
    --scene-accent: #f0cf88;
    --scene-tint: rgba(240, 207, 136, 0.18);
    background:
      radial-gradient(ellipse 85% 60% at 50% 6%, rgba(245, 205, 125, 0.24), transparent 62%),
      radial-gradient(ellipse 70% 55% at 74% 68%, rgba(240, 175, 100, 0.13), transparent 65%),
      linear-gradient(180deg, #0b1124 0%, #161f3d 54%, #090f20 100%);
  }
  /* 场景2：冰冷算力机房 (Server Abyss) */
  #stage[data-scene="server"] {
    --scene-accent: #7cc9ff;
    --scene-tint: rgba(124, 201, 255, 0.16);
    background:
      radial-gradient(ellipse 80% 55% at 32% 22%, rgba(72, 168, 255, 0.18), transparent 62%),
      radial-gradient(ellipse 70% 55% at 78% 72%, rgba(232, 122, 150, 0.12), transparent 65%),
      linear-gradient(180deg, #040a16 0%, #08182e 54%, #040b18 100%);
  }
  /* 场景3：花窗告解室 (Stained-Glass Confessional) */
  #stage[data-scene="confessional"] {
    --scene-accent: #e87a96;
    --scene-tint: rgba(232, 122, 150, 0.18);
    background:
      radial-gradient(ellipse 85% 60% at 38% 12%, rgba(232, 122, 150, 0.22), transparent 62%),
      radial-gradient(ellipse 70% 55% at 75% 70%, rgba(168, 124, 255, 0.14), transparent 65%),
      linear-gradient(180deg, #120b22 0%, #1d1335 55%, #0c081a 100%);
  }
  /* 场景4：圣泉洗礼池 (Baptismal Font) */
  #stage[data-scene="baptism"] {
    --scene-accent: #7CE8D8;
    --scene-tint: rgba(124, 232, 216, 0.18);
    background:
      radial-gradient(ellipse 90% 62% at 52% 10%, rgba(124, 232, 216, 0.23), transparent 64%),
      radial-gradient(ellipse 80% 55% at 68% 75%, rgba(124, 201, 255, 0.18), transparent 65%),
      linear-gradient(180deg, #061729 0%, #0c2b48 54%, #061526 100%);
  }
  /* 场景5：晨曦玫瑰庭院 (Dawn Rose Garden) */
  #stage[data-scene="garden"] {
    --scene-accent: #f6b89e;
    --scene-tint: rgba(246, 184, 158, 0.22);
    background:
      radial-gradient(ellipse 92% 65% at 50% 8%, rgba(255, 210, 148, 0.28), transparent 64%),
      radial-gradient(ellipse 80% 58% at 74% 72%, rgba(246, 168, 198, 0.20), transparent 65%),
      linear-gradient(180deg, #17122b 0%, #261d3f 52%, #131126 100%);
  }

  /* ================== 背景哥特花窗与神圣几何层 ================== */
  .cathedral-backdrop {
    position: absolute; inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 1;
  }
  /* 哥特尖拱花窗剪影 */
  .rose-window {
    position: absolute;
    top: -8vh; left: 50%;
    width: 78vh; height: 78vh;
    transform: translateX(-50%);
    border-radius: 50%;
    border: 1.5px solid rgba(240, 207, 136, 0.16);
    box-shadow:
      inset 0 0 80px var(--scene-tint),
      0 0 110px var(--scene-tint);
    opacity: 0.65;
    animation: slowSpin 95s linear infinite;
    transition: opacity .9s ease, box-shadow .9s ease;
  }
  .rose-window::before, .rose-window::after {
    content: ""; position: absolute; inset: 9%;
    border-radius: 50%;
    border: 1px dashed rgba(240, 207, 136, 0.22);
  }
  .rose-window::after {
    inset: 24%;
    border: 1px solid rgba(124, 201, 255, 0.18);
  }
  #stage[data-scene="server"] .rose-window {
    opacity: 0.22;
    border-color: rgba(124, 201, 255, 0.25);
  }
  /* 机房扫描网格层 (仅在 server 场景浮现) */
  .server-grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(124, 201, 255, 0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(124, 201, 255, 0.06) 1px, transparent 1px);
    background-size: 46px 46px;
    mask-image: radial-gradient(ellipse 80% 70% at 50% 45%, #000 30%, transparent 80%);
    opacity: 0;
    transition: opacity .9s ease;
  }
  #stage[data-scene="server"] .server-grid { opacity: 0.85; }

  /* 圣堂倾泻光柱 */
  .light-rays {
    position: absolute; inset: -15% -10% 0 -10%;
    background:
      conic-gradient(from 196deg at 52% -6%,
        transparent 0deg,
        var(--scene-tint) 9deg,
        transparent 20deg,
        rgba(124, 201, 255, 0.08) 31deg,
        transparent 44deg,
        var(--scene-tint) 56deg,
        transparent 72deg);
    filter: blur(22px);
    pointer-events: none;
    animation: raySway 11s ease-in-out infinite alternate;
    z-index: 1;
  }

  /* 两侧哥特石柱暗角与烛台氛围 */
  .arch-frame {
    position: absolute; inset: 0;
    pointer-events: none;
    z-index: 2;
    box-shadow: inset 0 0 130px rgba(2, 6, 15, 0.82);
  }
  .candle-glow {
    position: absolute;
    bottom: 24vh;
    width: 260px; height: 260px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 198, 105, 0.22) 0%, rgba(255, 160, 75, 0.06) 45%, transparent 72%);
    filter: blur(10px);
    animation: candleFlicker 3.6s ease-in-out infinite alternate;
    pointer-events: none;
    transition: opacity .8s ease;
  }
  .candle-glow.left  { left: 2vw; }
  .candle-glow.right { right: 2vw; animation-delay: -1.7s; }
  #stage[data-scene="server"] .candle-glow { opacity: 0.15; }

  @keyframes slowSpin { to { transform: translateX(-50%) rotate(360deg); } }
  @keyframes raySway {
    0%   { opacity: .65; transform: rotate(-1.5deg) scale(1); }
    100% { opacity: 1;   transform: rotate(1.5deg) scale(1.04); }
  }
  @keyframes candleFlicker {
    0%   { transform: scale(0.95); opacity: 0.72; }
    50%  { transform: scale(1.05); opacity: 0.96; }
    100% { transform: scale(0.98); opacity: 0.82; }
  }

  canvas#fx {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 3;
  }

  /* ================== 顶部导播控制栏 ================== */
  #topbar {
    position: absolute; top: 0; left: 0; right: 0;
    height: 52px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px;
    background: linear-gradient(180deg, rgba(5, 11, 24, 0.86), rgba(5, 11, 24, 0.25));
    border-bottom: 1px solid rgba(240, 207, 136, 0.16);
    backdrop-filter: blur(8px);
    z-index: 25;
    transition: opacity .35s ease, transform .35s ease;
  }
  body.clean #topbar { opacity: 0; transform: translateY(-100%); pointer-events: none; }
  .brand {
    display: flex; align-items: center; gap: 12px;
    font-size: 14px; letter-spacing: .16em; color: var(--gold);
  }
  .brand .cross-badge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 24px; height: 24px; border-radius: 50%;
    border: 1px solid rgba(240, 207, 136, 0.45);
    background: rgba(240, 207, 136, 0.1);
    font-size: 12px; color: var(--gold);
  }
  .brand .sub {
    color: var(--ink-dim); font-size: 11.5px; letter-spacing: .12em;
  }
  .scene-indicator {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 11px; border-radius: 999px;
    background: rgba(240, 207, 136, 0.09);
    border: 1px solid rgba(240, 207, 136, 0.28);
    font-size: 11.5px; color: var(--gold);
    letter-spacing: .08em;
  }
  .chapters { display: flex; gap: 7px; }
  .chap-pill {
    padding: 4px 13px; border-radius: 999px;
    font-size: 12px; letter-spacing: .08em;
    color: var(--ink-dim);
    border: 1px solid rgba(240, 207, 136, 0.2);
    background: rgba(10, 20, 42, 0.5);
    cursor: pointer; transition: all .25s ease;
  }
  .chap-pill:hover { color: var(--ivory); border-color: rgba(240, 207, 136, 0.48); }
  .chap-pill.active {
    color: #0b1326; background: var(--gold);
    border-color: var(--gold); font-weight: 600;
    box-shadow: 0 0 14px rgba(240, 207, 136, 0.35);
  }
  .controls {
    display: flex; align-items: center; gap: 9px;
    font-family: "Microsoft YaHei", sans-serif; font-size: 12px;
  }
  .ctrl-btn {
    padding: 5px 12px; border-radius: 6px;
    border: 1px solid rgba(240, 207, 136, 0.28);
    background: rgba(14, 27, 56, 0.72);
    color: var(--ivory); cursor: pointer;
    font-size: 12px; transition: all .2s ease;
  }
  .ctrl-btn:hover { border-color: var(--gold); background: rgba(240, 207, 136, 0.16); }
  .ctrl-btn.on {
    background: rgba(240, 207, 136, 0.24);
    border-color: var(--gold); color: var(--gold);
  }
  .speed-wrap {
    display: flex; align-items: center; gap: 6px; color: var(--ink-dim);
  }
  .speed-wrap input[type="range"] {
    width: 68px; accent-color: var(--gold); cursor: pointer;
  }

  /* ================== 上半部主舞台：左黑板 + 右修女鲸立绘 ================== */
  #upper-stage {
    position: absolute;
    top: 56px; left: 4.5vw; right: 4.5vw;
    bottom: 242px;
    display: grid;
    grid-template-columns: minmax(340px, 47%) 1fr;
    align-items: center;
    gap: 2.5vw;
    z-index: 6;
    pointer-events: none;
  }

  /* 左侧修道院黑板/法典展示区 */
  #blackboard {
    position: relative;
    width: 100%; max-width: 680px;
    min-height: 255px; max-height: 100%;
    justify-self: start;
    padding: 26px 32px;
    border-radius: 16px;
    background: linear-gradient(155deg, rgba(14, 26, 54, 0.90), rgba(8, 16, 36, 0.94));
    border: 1px solid var(--border);
    box-shadow:
      0 20px 55px rgba(0, 0, 0, 0.58),
      inset 0 0 0 1px rgba(255, 255, 255, 0.05),
      inset 0 0 38px rgba(240, 207, 136, 0.05);
    display: flex; flex-direction: column; justify-content: center;
    transition: all .45s cubic-bezier(.22,.8,.28,1);
    overflow: hidden;
  }
  #blackboard::before {
    content: "";
    position: absolute; top: 0; left: 0; width: 4px; height: 100%;
    background: linear-gradient(180deg, var(--gold), var(--cyan));
    opacity: .9;
  }
  /* 卡片四角修道院花纹饰线 */
  #blackboard::after {
    content: "✠";
    position: absolute; bottom: 12px; right: 18px;
    font-size: 16px; color: rgba(240, 207, 136, 0.22);
    pointer-events: none;
  }
  #blackboard[data-tone="bad"] {
    border-color: rgba(232, 122, 150, 0.45);
    background: linear-gradient(155deg, rgba(38, 15, 32, 0.90), rgba(18, 9, 22, 0.94));
  }
  #blackboard[data-tone="bad"]::before {
    background: linear-gradient(180deg, var(--rose), #8f2d47);
  }
  #blackboard[data-tone="good"] {
    border-color: rgba(124, 232, 216, 0.45);
    background: linear-gradient(155deg, rgba(11, 34, 48, 0.90), rgba(7, 20, 36, 0.94));
  }
  #blackboard[data-tone="good"]::before {
    background: linear-gradient(180deg, #7ce8d8, var(--gold));
  }
  #blackboard[data-tone="holy"] {
    border-color: rgba(240, 207, 136, 0.62);
    background: linear-gradient(155deg, rgba(34, 26, 48, 0.92), rgba(14, 18, 38, 0.95));
    box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 35px rgba(240, 207, 136, 0.14);
  }

  .bb-tag {
    font-size: 12px; letter-spacing: .22em;
    color: var(--gold); text-transform: uppercase;
    margin-bottom: 8px; opacity: .92;
    display: flex; align-items: center; gap: 8px;
  }
  .bb-tag::before { content: "✦"; font-size: 11px; }
  #blackboard[data-tone="bad"] .bb-tag { color: var(--rose); }
  #blackboard[data-tone="good"] .bb-tag { color: #7ce8d8; }

  .bb-title {
    font-size: clamp(21px, 2.3vw, 29px);
    font-weight: 700; color: var(--ivory);
    letter-spacing: .05em; margin-bottom: 14px;
    text-shadow: 0 2px 14px rgba(240, 207, 136, 0.22);
  }
  .bb-body {
    font-size: clamp(14.5px, 1.3vw, 17.5px);
    line-height: 1.78; color: #dbe6fb;
  }
  .bb-body .line {
    display: block; padding: 3px 0;
  }
  .bb-body .line::before {
    content: "· "; color: var(--gold); font-weight: bold;
  }
  .bb-body .quote {
    margin-top: 8px; padding: 10px 14px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.045);
    border-left: 3px solid var(--gold);
    font-style: italic; color: var(--ivory);
  }
  .bb-body .bad-quote {
    border-left-color: var(--rose);
    background: rgba(232, 122, 150, 0.09);
    color: #ffd6e0;
    font-family: "Consolas", "Microsoft YaHei", monospace;
    font-style: normal;
  }
  .bb-body .good-quote {
    border-left-color: #7ce8d8;
    background: rgba(124, 232, 216, 0.09);
    color: #dffef9;
    font-style: normal;
  }
  .bb-stamp {
    position: absolute; top: 18px; right: 22px;
    padding: 4px 12px; border-radius: 6px;
    border: 1.5px solid var(--rose);
    color: var(--rose); font-size: 12px; font-weight: 700;
    letter-spacing: .16em; transform: rotate(8deg);
    opacity: .88;
  }
  .bb-stamp.good {
    border-color: #7ce8d8; color: #7ce8d8; transform: rotate(-6deg);
  }
  .bb-stamp.holy {
    border-color: var(--gold); color: var(--gold); transform: rotate(-4deg);
  }

  /* ================== 右侧修女鲸鱼立绘舞台与灵动动作系统 ================== */
  #portrait-stage {
    position: relative;
    height: 100%;
    display: flex; align-items: flex-end; justify-content: center;
    pointer-events: none;
  }
  /* 身后神圣背光环 (Halo Ring) */
  .halo-ring {
    position: absolute;
    bottom: 22vh;
    width: 42vh; height: 42vh;
    border-radius: 50%;
    border: 1.5px solid rgba(240, 207, 136, 0.30);
    box-shadow:
      0 0 60px var(--scene-tint),
      inset 0 0 40px var(--scene-tint);
    animation: haloPulse 5s ease-in-out infinite alternate;
    pointer-events: none;
  }
  .halo-ring::before {
    content: "✠";
    position: absolute; top: -12px; left: 50%;
    transform: translateX(-50%);
    font-size: 16px; color: var(--gold);
    text-shadow: 0 0 10px var(--gold);
  }
  @keyframes haloPulse {
    0%   { transform: scale(0.96) rotate(-4deg); opacity: 0.55; }
    100% { transform: scale(1.04) rotate(4deg);  opacity: 0.92; }
  }

  /* 动作容器：负责跳跃、歪头、祈祷摇摆、害羞缩肩、故障抖动等 */
  #sprite-rig {
    position: relative;
    height: min(64vh, 620px);
    aspect-ratio: 987 / 1481;
    display: flex; align-items: flex-end; justify-content: center;
    transform-origin: 50% 92%;
    animation: breatheIdle 4.2s ease-in-out infinite;
    transition: filter .4s ease;
  }
  #portrait-img {
    width: 100%; height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 18px 36px rgba(2, 6, 18, 0.78));
    transition: opacity .22s ease, transform .35s cubic-bezier(.22,.8,.28,1), filter .35s ease;
  }

  /* 头顶灵动心情气泡 (Emote Bubble) */
  #emote-bubble {
    position: absolute;
    top: 4%; right: 6%;
    min-width: 44px; height: 44px;
    padding: 0 12px;
    border-radius: 999px;
    background: rgba(16, 30, 62, 0.92);
    border: 1.5px solid var(--gold);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.48), 0 0 18px rgba(240, 207, 136, 0.28);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; color: var(--gold);
    opacity: 0; transform: scale(0.4) translateY(12px);
    transition: opacity .28s ease, transform .32s cubic-bezier(.34,1.56,.64,1);
    z-index: 10;
  }
  #emote-bubble.show {
    opacity: 1; transform: scale(1) translateY(0);
    animation: bubbleFloat 2.2s ease-in-out infinite alternate;
  }
  @keyframes bubbleFloat {
    0%   { transform: scale(1) translateY(0); }
    100% { transform: scale(1.06) translateY(-6px); }
  }

  /* 基础呼吸与各情绪灵动动作 */
  @keyframes breatheIdle {
    0%, 100% { transform: translateY(0) scale(1, 1); }
    50%      { transform: translateY(-6px) scale(1.006, 0.995); }
  }
  /* 雀跃双跳 (bounce) */
  #sprite-rig[data-act="bounce"] {
    animation: actBounce 0.72s cubic-bezier(.28,.84,.42,1) 1, breatheIdle 4.2s ease-in-out 0.72s infinite;
  }
  @keyframes actBounce {
    0%   { transform: translateY(0) scale(1, 1); }
    22%  { transform: translateY(-22px) scale(0.97, 1.04) rotate(-1.5deg); }
    45%  { transform: translateY(0) scale(1.03, 0.97); }
    68%  { transform: translateY(-11px) scale(0.99, 1.02) rotate(1.5deg); }
    100% { transform: translateY(0) scale(1, 1); }
  }
  /* 笨拙歪头疑惑 (tilt) */
  #sprite-rig[data-act="tilt"] {
    animation: actTilt 3.6s ease-in-out infinite;
  }
  @keyframes actTilt {
    0%, 100% { transform: rotate(-3.2deg) translateY(-2px); }
    50%      { transform: rotate(2.8deg) translateY(-7px); }
  }
  /* 虔诚祈祷轻摇 (sway) */
  #sprite-rig[data-act="sway"] {
    animation: actSway 4.8s ease-in-out infinite;
  }
  @keyframes actSway {
    0%, 100% { transform: translateY(0) rotate(-1.6deg) scale(1); }
    50%      { transform: translateY(-8px) rotate(1.6deg) scale(1.012); }
  }
  /* 鼓腮急眼小跺脚 (puff) */
  #sprite-rig[data-act="puff"] {
    animation: actPuff 0.55s ease-in-out 2, breatheIdle 4.2s ease-in-out 1.1s infinite;
  }
  @keyframes actPuff {
    0%, 100% { transform: translateX(0) scale(1); }
    25%      { transform: translateX(-6px) translateY(-5px) scale(1.03, 0.98) rotate(-2deg); }
    75%      { transform: translateX(6px) translateY(-5px) scale(1.03, 0.98) rotate(2deg); }
  }
  /* 害羞缩肩轻颤 (shy) */
  #sprite-rig[data-act="shy"] {
    animation: actShy 3.2s ease-in-out infinite;
  }
  @keyframes actShy {
    0%, 100% { transform: translateY(4px) scale(0.975) rotate(-1.5deg); }
    50%      { transform: translateY(0px) scale(0.985) rotate(1.5deg); }
  }
  /* 人机故障僵直抽帧 (glitch) */
  #sprite-rig[data-act="glitch"] {
    animation: actGlitch 2.4s steps(2, end) infinite;
  }
  @keyframes actGlitch {
    0%, 84%, 100% { transform: translate(0, 0); filter: saturate(0.68) contrast(1.08); }
    86% { transform: translate(-4px, 1px) skewX(1.5deg); filter: saturate(0.4) hue-rotate(25deg); }
    90% { transform: translate(4px, -2px) skewX(-1.5deg); }
    94% { transform: translate(-2px, 0); }
  }
  /* 戏精登场亮剑冲锋感 (hero) */
  #sprite-rig[data-act="hero"] {
    animation: actHero 0.68s cubic-bezier(.18,.89,.32,1.28) 1, breatheIdle 3.8s ease-in-out 0.68s infinite;
  }
  @keyframes actHero {
    0%   { transform: scale(0.92) translateY(14px); }
    55%  { transform: scale(1.065) translateY(-16px) rotate(-2.5deg); }
    100% { transform: scale(1) translateY(0) rotate(0deg); }
  }

  /* 借脸情绪氛围滤镜 */

// ================== 核心剧场引擎 ==================
const stageEl      = document.getElementById("stage");
const sceneBadgeEl = document.getElementById("scene-badge");
const sceneInlineEl= document.getElementById("scene-inline");
const chapNavEl    = document.getElementById("chap-nav");
const bbEl         = document.getElementById("blackboard");
const bbTagEl      = document.getElementById("bb-tag");
const bbTitleEl    = document.getElementById("bb-title");
const bbBodyEl     = document.getElementById("bb-body");
const bbStampEl    = document.getElementById("bb-stamp");
const rigEl        = document.getElementById("sprite-rig");
const imgEl        = document.getElementById("portrait-img");
const bubbleEl     = document.getElementById("emote-bubble");
const moodTagEl    = document.getElementById("mood-tag");
const progressEl   = document.getElementById("dlg-progress");
const dlgTextEl    = document.getElementById("dlg-text");
const dlgBoxEl     = document.getElementById("dialogue-box");
const speedRangeEl = document.getElementById("speed-range");
const btnAutoEl    = document.getElementById("btn-auto");
const btnPrevEl    = document.getElementById("btn-prev");
const btnCleanEl   = document.getElementById("btn-clean");
const btnBookletEl = document.getElementById("btn-booklet");
const modalEl      = document.getElementById("booklet-modal");
const modalContent = document.getElementById("modal-content");
const btnCloseModal= document.getElementById("btn-close-modal");

modalContent.textContent = BOOKLET_TEXT;

let curIdx = 0;
let typingTimer = null;
let autoTimer = null;
let isTyping = false;
let isAuto = false;
let currentFullText = "";
let currentParticleMode = "gold";

function getCharInterval() {
  const v = Number(speedRangeEl.value) || 36;
  return Math.max(16, Math.round(78 - v));
}

function renderCard(card) {
  if (!card) return;
  bbEl.setAttribute("data-tone", card.tone || "normal");
  bbTagEl.textContent = card.tag || "";
  bbTitleEl.textContent = card.title || "";
  bbBodyEl.innerHTML = "";

  if (Array.isArray(card.lines)) {
    card.lines.forEach(line => {
      const span = document.createElement("span");
      span.className = "line";
      span.textContent = line;
      bbBodyEl.appendChild(span);
    });
  }
  if (card.quote) {
    const q = document.createElement("div");
    q.className = "quote";
    q.textContent = card.quote;
    bbBodyEl.appendChild(q);
  }
  if (card.badQuote) {
    const bq = document.createElement("div");
    bq.className = "quote bad-quote";
    bq.innerHTML = card.badQuote.replace(/\n/g, "<br/>");
    bbBodyEl.appendChild(bq);
  }
  if (card.goodQuote) {
    const gq = document.createElement("div");
    gq.className = "quote good-quote";
    gq.innerHTML = card.goodQuote.replace(/\n/g, "<br/>");
    bbBodyEl.appendChild(gq);
  }
  if (card.stamp) {
    bbStampEl.style.display = "block";
    bbStampEl.textContent = card.stamp;
    bbStampEl.className = "bb-stamp " + (card.tone === "good" ? "good" : card.tone === "holy" ? "holy" : "");
  } else {
    bbStampEl.style.display = "none";
  }
}

function triggerAct(actName) {
  rigEl.removeAttribute("data-act");
  void rigEl.offsetWidth;
  rigEl.setAttribute("data-act", actName || "sway");
}

function showFrame(idx) {
  if (idx < 0) idx = 0;
  if (idx >= SCRIPT.length) {
    stopAuto();
    return;
  }
  curIdx = idx;
  const item = SCRIPT[curIdx];

  const sceneKey = item.scene || "sanctuary";
  const sceneMeta = CONFIG.scenes[sceneKey] || CONFIG.scenes.sanctuary;
  stageEl.setAttribute("data-scene", sceneKey);
  sceneBadgeEl.textContent = "场景 · " + sceneMeta.name;
  sceneInlineEl.textContent = sceneMeta.name;
  currentParticleMode = sceneMeta.particle;

  document.querySelectorAll(".chap-pill").forEach(btn => {
    btn.classList.toggle("active", Number(btn.dataset.chap) === item.chap);
  });

  renderCard(item.card);

  const expr = item.expr || "smile";
  const nextSrc = CONFIG.sprites[expr] || CONFIG.sprites.smile;
  if (imgEl.getAttribute("src") !== nextSrc) {
    imgEl.style.opacity = "0.78";
    imgEl.setAttribute("src", nextSrc);
    requestAnimationFrame(() => { imgEl.style.opacity = "1"; });
  }
  rigEl.setAttribute("data-expr", expr);
  triggerAct(item.act || "sway");

  if (item.bubble) {
    bubbleEl.textContent = item.bubble;
    bubbleEl.classList.add("show");
  } else {
    bubbleEl.classList.remove("show");
  }

  moodTagEl.textContent = item.mood || "温柔";
  progressEl.textContent = String(curIdx + 1).padStart(2, "0") + " / " + String(SCRIPT.length).padStart(2, "0");

  clearInterval(typingTimer);
  clearTimeout(autoTimer);
  currentFullText = item.text || "";
  dlgTextEl.textContent = "";
  isTyping = true;

  let charPos = 0;
  const interval = getCharInterval();
  typingTimer = setInterval(() => {
    charPos++;
    dlgTextEl.textContent = currentFullText.slice(0, charPos);
    if (charPos >= currentFullText.length) {
      finishTyping();
    }
  }, interval);
}

function finishTyping() {
  clearInterval(typingTimer);
  typingTimer = null;
  isTyping = false;
  dlgTextEl.textContent = currentFullText;
  if (isAuto && curIdx < SCRIPT.length - 1) {
    const pauseMs = Math.max(1500, Math.min(3400, currentFullText.length * 48));
    autoTimer = setTimeout(() => {
      showFrame(curIdx + 1);
    }, pauseMs);
  } else if (isAuto && curIdx >= SCRIPT.length - 1) {
    stopAuto();
  }
}

function stepForward() {
  if (isTyping) {
    finishTyping();
  } else if (curIdx < SCRIPT.length - 1) {
    showFrame(curIdx + 1);
  }
}

function toggleAuto() {
  if (isAuto) {
    stopAuto();
  } else {
    isAuto = true;
    btnAutoEl.classList.add("on");
    btnAutoEl.textContent = "Auto ❚❚";
    if (!isTyping) {
      showFrame(curIdx < SCRIPT.length - 1 ? curIdx + 1 : 0);
    }
  }
}

function stopAuto() {
  isAuto = false;
  clearTimeout(autoTimer);
  btnAutoEl.classList.remove("on");
  btnAutoEl.textContent = "Auto ▷";
}

dlgBoxEl.addEventListener("click", stepForward);
btnPrevEl.addEventListener("click", () => { stopAuto(); showFrame(curIdx - 1); });
btnAutoEl.addEventListener("click", toggleAuto);
btnCleanEl.addEventListener("click", () => {
  document.body.classList.toggle("clean");
  btnCleanEl.classList.toggle("on", document.body.classList.contains("clean"));
});
btnBookletEl.addEventListener("click", () => modalEl.classList.add("open"));
btnCloseModal.addEventListener("click", () => modalEl.classList.remove("open"));
modalEl.addEventListener("click", (e) => { if (e.target === modalEl) modalEl.classList.remove("open"); });

chapNavEl.addEventListener("click", (e) => {
  const btn = e.target.closest(".chap-pill");
  if (!btn) return;
  const targetChap = Number(btn.dataset.chap);
  const firstIdx = SCRIPT.findIndex(s => s.chap === targetChap);
  if (firstIdx !== -1) showFrame(firstIdx);
});

window.addEventListener("keydown", (e) => {
  if (modalEl.classList.contains("open")) {
    if (e.key === "Escape" || e.key === "b" || e.key === "B") modalEl.classList.remove("open");
    return;
  }
  if (e.code === "Space" || e.code === "ArrowRight" || e.code === "Enter") {
    e.preventDefault();
    stepForward();
  } else if (e.code === "ArrowLeft") {
    e.preventDefault();
    stopAuto();
    showFrame(curIdx - 1);
  } else if (e.key === "a" || e.key === "A") {
    toggleAuto();
  } else if (e.key === "c" || e.key === "C") {
    document.body.classList.toggle("clean");
    btnCleanEl.classList.toggle("on", document.body.classList.contains("clean"));
  } else if (e.key === "b" || e.key === "B") {
    modalEl.classList.toggle("open");
  }
});

// ================== 五大场景动态粒子引擎 ==================
const canvas = document.getElementById("fx");
const ctx = canvas.getContext("2d");
let W = 0, H = 0;
const particles = [];

function resizeCanvas() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

for (let i = 0; i < 56; i++) {
  particles.push({
    x: Math.random() * W,
    y: Math.random() * H,
    r: 1.2 + Math.random() * 3.2,
    vx: (Math.random() - 0.5) * 0.35,
    vy: -0.25 - Math.random() * 0.55,
    a: 0.2 + Math.random() * 0.55,
    phase: Math.random() * Math.PI * 2
  });
}

function drawParticles() {
  ctx.clearRect(0, 0, W, H);
  const now = performance.now() * 0.0015;
  for (const p of particles) {
    p.phase += 0.02;
    if (currentParticleMode === "matrix") {
      p.y += Math.abs(p.vy) * 1.6;
      if (p.y > H + 10) { p.y = -10; p.x = Math.random() * W; }
      ctx.fillStyle = `rgba(124, 201, 255, ${p.a * 0.75})`;
      ctx.fillRect(p.x, p.y, 1.8, p.r * 3.2);
    } else if (currentParticleMode === "petal") {
      p.x += Math.sin(now + p.phase) * 0.45 + 0.2;
      p.y += Math.abs(p.vy) * 0.65;
      if (p.y > H + 10) { p.y = -10; p.x = Math.random() * W; }
      if (p.x > W + 10) p.x = -10;
      ctx.beginPath();
      ctx.fillStyle = `rgba(246, 178, 198, ${p.a * 0.78})`;
      ctx.ellipse(p.x, p.y, p.r * 1.4, p.r * 0.85, p.phase, 0, Math.PI * 2);
      ctx.fill();
    } else if (currentParticleMode === "aqua") {
      p.x += Math.sin(now + p.phase) * 0.3;
      p.y += p.vy * 1.1;
      if (p.y < -10) { p.y = H + 10; p.x = Math.random() * W; }
      ctx.beginPath();
      ctx.strokeStyle = `rgba(124, 232, 216, ${p.a * 0.8})`;
      ctx.lineWidth = 1.2;
      ctx.arc(p.x, p.y, p.r * 1.3, 0, Math.PI * 2);
      ctx.stroke();
    } else {
      p.x += Math.sin(now + p.phase) * 0.25;
      p.y += p.vy * 0.75;
      if (p.y < -10) { p.y = H + 10; p.x = Math.random() * W; }
      const color = currentParticleMode === "rose"
        ? `rgba(232, 142, 170, ${p.a * 0.75})`
        : `rgba(240, 207, 136, ${p.a * 0.82})`;
      ctx.beginPath();
      ctx.fillStyle = color;
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  requestAnimationFrame(drawParticles);
}
drawParticles();
showFrame(0);
</script>
